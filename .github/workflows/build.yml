name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: Apple-Silicon
            argument: ''
            app: CiBar.app
          - runner: macos-15-intel
            architecture: Intel
            argument: --intel
            app: CiBar-Intel.app
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: zsh Tools/build.sh ${{ matrix.argument }}
      - name: Verify signature and self-tests
        run: |
          codesign --verify --deep --strict ../outputs/${{ matrix.app }}
          ../outputs/${{ matrix.app }}/Contents/MacOS/CiBar --self-test
      - name: Package clean app
        run: ditto -c -k --sequesterRsrc --keepParent ../outputs/${{ matrix.app }} ../outputs/CiBar-${{ matrix.architecture }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CiBar-${{ matrix.architecture }}
          path: ../outputs/CiBar-${{ matrix.architecture }}.zip
